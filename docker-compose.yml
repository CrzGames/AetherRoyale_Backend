services:
  adonis:
    container_name: adonis
    image: aetherroyale/backend:develop
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - '3400:3400'
    depends_on:
      - db_mariadb
      - redis
    networks:
      - app-network

  redis:
    container_name: redis
    image: redis:8.6
    restart: always
    ports:
      - '6379:6379'
    # Sans password (staging/dev local)
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    networks:
      - app-network

  redisinsight:
    container_name: redisinsight
    image: redis/redisinsight:latest
    restart: always
    ports:
      - '5540:5540'
    depends_on:
      - redis
    volumes:
      - redisinsight_data:/data
    networks:
      - app-network

  db_mariadb:
    container_name: db_mariadb
    image: mariadb:12.2.2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aetherroyale_develop
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpassword
    ports:
      - '3307:3306'
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - app-network

  phpmyadmin2:
    container_name: phpmyadmin2
    image: phpmyadmin/phpmyadmin
    restart: always
    environment:
      PMA_HOST: db_mariadb
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - '7200:80'
    depends_on:
      - db_mariadb
    networks:
      - app-network

  nats:
    container_name: nats
    image: nats:latest
    restart: always
    ports:
      - '4222:4222' # NATS client connections
      - '4223:4223' # WebSocket connections
      - '8222:8222' # HTTP monitoring
    volumes:
      - ./nats/nats_config.json:/etc/nats/nats_config.json # Mount a configuration file
    command: -c /etc/nats/nats_config.json
    networks:
      - app-network

networks:
  app-network:

volumes:
  database_data:
  node_modules:
  redis_data:
  redisinsight_data: